// ===== 남은 발언 기회 (puter.auth.getMonthlyUsage) =====
let lastPct=null,drops=[],lastEst=null;
async function refreshQuota(){if($('engine').value!=='puter'){$('qtxt').textContent='Pollinations: 공개 한도 정보 없음 (알 수 없음)';$('qfill').style.width='0';$('qsub').textContent='Pollinations는 잔여량 API를 제공하지 않습니다';return;}
 try{if(!puter.auth.isSignedIn()){$('qtxt').textContent='알 수 없음 (로그인 전)';$('qsub').textContent='첫 발언 시 Puter 로그인 창이 뜹니다';return;}
  const u=await puter.auth.getMonthlyUsage();const a=u&&u.allowanceInfo;
  const rem=Number(a&&a.remaining),tot=Number(a&&a.monthUsageAllowance);
  if(!a||!isFinite(rem)||!(tot>0)){$('qtxt').textContent='알 수 없음';$('qsub').textContent='API 응답에 잔여량 정보가 없음';return;}
  // 단위(마이크로센트 등)가 공식 문서에 명시되지 않아 금액($)은 표시하지 않고 비율(%)만 사용
  const pct=Math.max(0,Math.min(100,rem/tot*100));
  if(rem<=0||pct<0.5){switchToPoll('quota');return;}
  if(lastPct!==null&&lastPct-pct>0.001)drops.push(lastPct-pct);lastPct=pct;
  $('qfill').style.width=pct+'%';$('qfill').style.background=pct>50?'#22c55e':pct>20?'#eab308':'#ef4444';
  const avg=drops.length?drops.reduce((x,y)=>x+y,0)/drops.length:0;
  let est=avg?Math.floor(pct/avg):null;
  if(est!==null){if(lastEst!==null&&est>lastEst)est=lastEst;lastEst=est;}
  $('qtxt').textContent=`${pct.toFixed(1)}% 남음`+(est!==null?` · 약 ${est}회 (추정)`:'');
  $('qsub').textContent=avg?`추정: 호출당 평균 ${avg.toFixed(2)}%p 소모 (${drops.length}회 측정 기준)`:'회수 추정은 호출 후 표시 (추정)';}
 catch(e){if(isQuotaErr(e)){switchToPoll('quota');return;}$('qtxt').textContent='알 수 없음';$('qsub').textContent='사용량 조회 실패: '+(e.message||e.error||'');}}
$('qref').onclick=e=>{e.preventDefault();refreshQuota();};$('engine').onchange=refreshQuota;setTimeout(refreshQuota,1500);

function mdInline(t){return t.replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>').replace(/__([^_\n]+?)__/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<i>$2</i>').replace(/`([^`\n]+?)`/g,'<code>$1</code>');}
function md(src){const L=esc(String(src||'')).replace(/\r/g,'').split('\n');let out=[],list=null;
 const close=()=>{if(list){out.push(`</${list}>`);list=null;}};
 for(const raw of L){const l=raw.trim();let m;
  if(!l){close();out.push('<br>');continue;}
  if(/^(-{3,}|\*{3,}|_{3,})$/.test(l)){close();out.push('<hr>');continue;}
  if(m=l.match(/^(#{1,6})\s+(.*)$/)){close();const n=Math.min(6,m[1].length+2);out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);continue;}
  if(m=l.match(/^[-*•]\s+(.*)$/)){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push(`<li>${mdInline(m[1])}</li>`);continue;}
  if(m=l.match(/^\d+[.)]\s+(.*)$/)){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push(`<li>${mdInline(m[1])}</li>`);continue;}
  close();out.push(mdInline(l)+'<br>');}
 close();return out.join('').replace(/(<br>)+$/,'').replace(/^(<br>)+/,'').replace(/(<br>){3,}/g,'<br><br>');}
function stripSelfName(text,name){const lines=String(text||'').replace(/\r/g,'').split('\n');
 const toks=String(name||'').replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>=2);
 while(lines.length&&!lines[0].trim())lines.shift();
 if(lines.length>1||lines.length===1){const f=lines[0]||'',plain=f.replace(/[#*_>`:\-–—·|\[\]()]/g,' ');
  let rest=plain;toks.forEach(w=>rest=rest.split(w).join(' '));rest=rest.replace(/[\p{Extended_Pictographic}\uFE0F\s]|발언|입장|의견/gu,'');
  if(f.length<=60&&toks.length&&toks.some(w=>plain.includes(w))&&rest.length<=4&&lines.length>1)lines.shift();
  else if(toks.length){const re=new RegExp('^\\s*[#>*_\\s]*(?:\\p{Extended_Pictographic}\\uFE0F?\\s*)?\\**\\s*'+toks.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[\\s·:\\-*]*')+'[^\\n]{0,15}?\\**\\s*[:：]\\s*','u');lines[0]=f.replace(re,'');}}
 return lines.join('\n').trim();}

 const sys=`당신은 토론 패널 "${name}"(${role})입니다. 반드시 한국어로, 4~6문장으로 답하세요. 앞선 발언자의 주장을 이름을 들어 구체적으로 반박하거나 보완하고, 자기 관점의 근거를 제시하세요. 사회자의 지시가 있으면 우선 따르세요. 발언 맨 앞에 자신의 이름·역할·이모지나 제목(예: "# ○○ 발언")을 쓰지 말고 바로 본론으로 시작하세요. 다른 패널의 이모지를 사용하지 마세요.`+(spec.p?`\n\n[특기 대결] 당신의 특기는 "${spec.l}"입니다. 토론 발언에 더해 다음을 수행해 특기를 뽐내세요: ${spec.p}`:'');
 const user=`토론 주제: ${$('topic').value}\n현재 ${round}/${total} 라운드.\n\n지금까지의 대화:\n${T()||'(첫 발언입니다. 입장을 밝히세요.)'}\n\n이제 "${name}"로서 발언하세요.`;
 if($('engine').value==='poll')model='pollinations · openai';
 const el=add('',name.split(' ')[0],name,model+(sk!=='none'?' · '+spec.l:''),color,'… 생각 중');const tx=el.querySelector('.tx');
 const uc=(sk==='vision'&&lastImageUrl&&$('engine').value==='puter'&&!lastImageUrl.startsWith('blob:'))?[{type:'text',text:user+'\n\n(첨부: 토론 중 생성된 이미지)'},{type:'image_url',image_url:{url:lastImageUrl}}]:user;
 try{const r=await ask(model,[{role:'system',content:sys},{role:'user',content:uc}],alt=>{el.querySelector('.fb').textContent=`↪ '${model}' 없음 → ${alt} 시도 중`;});
  if(r.used!==model){el.querySelector('.fb').textContent=`↪ '${model}' 없음 → 대체 모델 ${r.used} 사용`;$('mo'+i).value=r.used;}
  let a=stripSelfName(r.text.trim(),name);if(sk==='none')a=a.replace(/<think>[\s\S]*?<\/think>/gi,'').trim();setTx(tx,a);
  if(sk!=='none'){const s=await doSpecial(sk,a,el,color,name);a=s.clean;setTx(tx,a);(specialLog[name]=specialLog[name]||[]).push(`R${round} ${spec.l}: ${s.shown}`);}
  transcript.push({who:name,text:a,round});}
 catch(e){tx.textContent='⚠️ 오류: '+errMsg(e)+' (모델 ID 확인 또는 엔진 변경)';}}

// RPTLIB-START (순수 함수: 단위 테스트 대상)
const CRIT=['사실 정확성','논리성','근거','반박력','설득력'];
function parseJudgeJSON(raw){let t=String(raw||'').replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'");
 const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)t=f[1];
 const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('JSON 없음');t=t.slice(a,b+1).replace(/,\s*([}\]])/g,'$1');
 const j=JSON.parse(t);const num=v=>{v=Number(v);return isFinite(v)?Math.max(0,Math.min(10,v)):0;};
 const rounds=(j.rounds||[]).map((r,k)=>({round:Number(r.round)||k+1,scores:(r.scores||[]).map(x=>{const c=x.criteria||x.scores||x;const vals=CRIT.map(n=>num(c[n]));return {name:String(x.name||'?'),criteria:Object.fromEntries(CRIT.map((n,i)=>[n,vals[i]])),total:vals.reduce((p,q)=>p+q,0),evidence:String(x.evidence||x.quote||'').slice(0,300),comment:String(x.comment||'').slice(0,200)};}),best:r.best?String(r.best):null}));
 return {rounds,winner:j.winner?String(j.winner):null,reason:String(j.reason||j.summary||'')};}
function aggregate(rep){const agg={};rep.rounds.forEach(r=>r.scores.forEach(s=>{const g=agg[s.name]=agg[s.name]||{name:s.name,sum:0,n:0,crit:Object.fromEntries(CRIT.map(c=>[c,0])),byRound:{}};g.sum+=s.total;g.n++;CRIT.forEach(c=>g.crit[c]+=s.criteria[c]);g.byRound[r.round]=s.total;}));
 const list=Object.values(agg).map(g=>({...g,avg:g.n?g.sum/g.n:0,crit:Object.fromEntries(CRIT.map(c=>[c,g.n?g.crit[c]/g.n:0]))}));list.sort((x,y)=>y.avg-x.avg);return list;}
// RPTLIB-END
const pcol=n=>{const i=P.findIndex((_,k)=>$('nm'+k).value===n);return i>=0?P[i][3]:'#94a3b8';};
function svgLine(series,xs,maxY,title){const W=520,H=240,L=36,B=28,T=24,Rr=10,x=k=>L+(xs.length<2?0:(W-L-Rr)*k/(xs.length-1)),y=v=>T+(H-T-B)*(1-v/maxY);
 let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><text x="${L}" y="14" fill="#cbd5e1" font-size="12">${esc(title)}</text>`;
 for(let v=0;v<=maxY;v+=maxY/5)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#33415588"/><text x="4" y="${y(v)+4}" fill="#94a3b8" font-size="10">${Math.round(v)}</text>`;
 xs.forEach((r,k)=>g+=`<text x="${x(k)-8}" y="${H-8}" fill="#94a3b8" font-size="10">R${r}</text>`);
 series.forEach(s=>{const pts=xs.map((r,k)=>s.vals[r]==null?null:[x(k),y(s.vals[r])]).filter(Boolean);g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"/>`).join('');});
 return g+'</svg>'+`<div class="md">${series.map(s=>`<span style="color:${s.color}">■</span> ${esc(s.name)}`).join(' &nbsp; ')}</div>`;}
function svgRadar(list){const W=320,C=160,Rr=110,n=CRIT.length,pt=(i,v)=>[C+Rr*v/10*Math.sin(2*Math.PI*i/n),C-Rr*v/10*Math.cos(2*Math.PI*i/n)];
 let g=`<svg viewBox="0 0 ${W} ${W+10}" role="img" aria-label="기준별 레이더">`;[2,4,6,8,10].forEach(v=>g+=`<polygon fill="none" stroke="#33415599" points="${CRIT.map((_,i)=>pt(i,v).join(',')).join(' ')}"/>`);
 CRIT.forEach((c,i)=>{const [a,b]=pt(i,11.8);g+=`<text x="${a}" y="${b}" fill="#cbd5e1" font-size="11" text-anchor="middle">${c}</text>`;});
 list.forEach(p=>{const col=pcol(p.name);g+=`<polygon fill="${col}33" stroke="${col}" stroke-width="2" points="${CRIT.map((c,i)=>pt(i,p.crit[c]).join(',')).join(' ')}"/>`;});return g+'</svg>';}
function critBars(list){return `<table><tr><th>기준</th>${list.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>${CRIT.map(c=>`<tr><td>${c}</td>${list.map(p=>`<td><div class="bar" style="width:${p.crit[c]*10}%;--c:${pcol(p.name)}"></div>${p.crit[c].toFixed(1)}</td>`).join('')}</tr>`).join('')}</table>`;}
function renderReport(rep){const list=aggregate(rep),rs=rep.rounds.map(r=>r.round);const w=rep.winner||list[0]?.name;
 let h=`<div class="card win"><h3>🏆 승자: ${esc(w||'판정 불가')}</h3><div>${esc(rep.reason)}</div><div class="md">주제: ${esc($('topic').value)} · ${new Date().toLocaleString('ko-KR')}</div></div>`;
 h+=`<div class="card"><h3>🥇 순위표</h3><table><tr><th>순위</th><th>패널</th><th>평균 총점(/50)</th>${CRIT.map(c=>`<th>${c}</th>`).join('')}</tr>${list.map((p,k)=>`<tr><td>${k+1}</td><td><span style="color:${pcol(p.name)}">■</span> ${esc(p.name)}</td><td><b>${p.avg.toFixed(1)}</b></td>${CRIT.map(c=>`<td>${p.crit[c].toFixed(1)}</td>`).join('')}</tr>`).join('')}</table></div>`;
 h+=`<div class="grid2"><div class="card"><h3>📈 라운드별 점수</h3>${svgLine(list.map(p=>({name:p.name,color:pcol(p.name),vals:p.byRound})),rs,50,'라운드별 총점 (0~50)')}</div><div class="card"><h3>🕸️ 기준별 레이더 (평균)</h3>${svgRadar(list)}</div></div>`;
 h+=`<div class="card"><h3>📊 기준별 막대</h3>${critBars(list)}</div>`;
 if(typeof audHist!=='undefined'&&audHist.length){const names=Object.keys(audHist[audHist.length-1].tally.counts);const ar=audHist.map(a=>a.round);const mx=Math.max(1,...audHist.flatMap(a=>Object.values(a.tally.counts)));
  h+=`<div class="card"><h3>👥 방청객 지지 추이</h3>${svgLine(names.map(n=>({name:n,color:pcol(n),vals:Object.fromEntries(audHist.map(a=>[a.round,a.tally.counts[n]||0]))})),ar,mx,'라운드별 지지 인원')}</div>`;}
 h+=`<div class="card"><h3>🔍 라운드별 핵심 근거</h3>${rep.rounds.map(r=>`<h4>라운드 ${r.round}${r.best?' · 우세: '+esc(r.best):''}</h4>${r.scores.map(s=>`<div><b style="color:${pcol(s.name)}">${esc(s.name)}</b> ${s.total}/50 — ${esc(s.comment)}${s.evidence?`<blockquote>“${esc(s.evidence)}”</blockquote>`:''}</div>`).join('')}`).join('')}</div>`;
 $('report').innerHTML=h;$('reportSec').scrollIntoView({behavior:'smooth'});}
async function makeReport(){const said=transcript.filter(t=>t.round&&t.who!=='사회자');if(!said.length){$('report').innerHTML='<div class="card">먼저 토론을 진행해 주세요.</div>';$('reportSec').scrollIntoView();return;}
 const model=firstModel();$('report').innerHTML='<div class="card">📊 판정 중… (심판 AI 1회 호출)</div>';$('reportSec').scrollIntoView({behavior:'smooth'});
 const byR={};said.forEach(t=>(byR[t.round]=byR[t.round]||[]).push(`[${t.who}] ${t.text}`));
 const rec=Object.entries(byR).map(([r,a])=>`### 라운드 ${r}\n${a.join('\n\n')}`).join('\n\n');
 const prompt=`주제: ${$('topic').value}\n\n라운드별 발언 기록:\n${rec}\n\n당신은 공정한 심판입니다. 각 라운드에서 실제로 한 말만 근거로 각 패널을 기준별 0~10점으로 채점하세요. 기준: ${CRIT.join(', ')}. evidence에는 해당 라운드 발언에서 그대로 인용한 핵심 문장(60자 이내)을 넣으세요. 기록 밖 지식으로 가산하지 마세요(사실 정확성 판단은 예외). 오직 JSON만 출력:\n{"rounds":[{"round":1,"best":"이름","scores":[{"name":"이름","criteria":{${CRIT.map(c=>`"${c}":0`).join(',')}},"evidence":"인용","comment":"한줄평"}]}],"winner":"이름","reason":"종합 판정 이유 2~3문장"}`;
 try{const r=await ask(model,[{role:'system',content:'당신은 엄격하고 공정한 토론 심판입니다. 한국어로, JSON만 출력합니다.'},{role:'user',content:prompt}]);renderReport(parseJudgeJSON(r.text));}
 catch(e){$('report').innerHTML='<div class="card">⚠️ 판정 리포트 생성 실패: '+esc(errMsg(e))+' — 다시 눌러 주세요.</div>';}}
document.addEventListener('click',ev=>{const t=ev.target.closest&&ev.target.closest('button');if(!t)return;if(t.classList.contains('rptBtn'))makeReport();else if(t.id==='rptPrint')window.print();else if(t.id==='rptSave')saveReport();});
function saveReport(){const css=[...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');const html=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>판정 리포트</title>${css}</head><body><section id="reportSec">${$('report').outerHTML}</section></body></html>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='판정리포트.html';a.click();}

const AUD_POOL={
 job:[["대학생","미래세대 안전"],["농민","전기요금·농업용수"],["자영업자","운영비와 전기요금"],["에너지기업 직원","일자리"],["어린 자녀 부모","미래세대 안전"],["은퇴자","노후 생활비"],["간호사","건강·안전"],["공무원","정책 실현 가능성"],["스타트업 개발자","기술 혁신"],["어부","해양 환경·생계"],["고등학교 교사","미래 세대 교육"],["택배기사","생활 물가"],["환경단체 활동가","기후위기 대응"],["제조업 공장장","전력 공급 안정"],["주부","전기요금 부담"]],
 lean:["찬성 성향","반대 성향","중도","무관심했지만 관심 생김","신중론"]};
function seededRand(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296;};}
function genAudience(n,seed){const rnd=seededRand(seed||Date.now());const jobs=[...AUD_POOL.job];const out=[];
 n=Math.max(0,Math.min(12,n|0));
 for(let i=0;i<n;i++){const j=jobs.splice(Math.floor(rnd()*jobs.length),1)[0]||AUD_POOL.job[i%AUD_POOL.job.length];
  out.push({id:i+1,job:j[0],criterion:j[1],lean:AUD_POOL.lean[Math.floor(rnd()*AUD_POOL.lean.length)],emoji:["🧑‍🎓","👨‍🌾","🧑‍🍳","👷","👩‍👧","👴","🧑‍⚕️","🧑‍💼","🧑‍💻","🎣","🧑‍🏫","🚚","🌱","🏭","🏠"][AUD_POOL.job.findIndex(x=>x[0]===j[0])]||"🙂"});}
 return out;}
// 모델 출력 → [{id,comment,emoji,support}] 정규화. 코드펜스/앞뒤 잡담/후행 콤마/스마트 따옴표/객체 래핑 허용
function parseAudienceJSON(text,members,panelNames){
 let t=String(text||'').replace(/\r/g,'');const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)t=f[1];
 t=t.replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'");
 const a=t.indexOf('['),o=t.indexOf('{');let start=(a>=0&&(o<0||a<o))?a:o;if(start<0)throw new Error('JSON 없음');
 const open=t[start],close=open==='['?']':'}';let depth=0,inStr=false,esc=false,end=-1;
 for(let i=start;i<t.length;i++){const c=t[i];if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue;}
  if(c==='"')inStr=true;else if(c==='['||c==='{')depth++;else if(c===']'||c==='}'){depth--;if(depth===0){end=i;break;}}}
 let body=t.slice(start,end<0?t.length:end+1).replace(/,\s*([\]}])/g,'$1');
 let j;try{j=JSON.parse(body);}catch(e){throw new Error('JSON 파싱 실패: '+e.message);}
 if(!Array.isArray(j))j=j.audience||j.reactions||j.members||Object.values(j).find(Array.isArray)||[];
 const norm=s=>String(s||'').replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
 const matchPanel=s=>{if(s==null)return null;const n=norm(s);if(!n||/없음|중립|none|undecided|모름/.test(n))return null;
  return panelNames.find(p=>norm(p)===n)||panelNames.find(p=>norm(p).includes(n)||n.includes(norm(p)))||
   panelNames.find(p=>String(p).replace(/[^\p{L}\p{N}\s]/gu,' ').split(/[\s·]+/).filter(w=>w.length>=2).some(w=>n.includes(norm(w))))||null;};
 const out=[];
 j.forEach((r,k)=>{if(!r||typeof r!=='object')return;let id=+(r.id??r.member??r.no);
  if(!(id>=1)){const m=members.find(m=>r.job&&String(r.job).includes(m.job));id=m?m.id:k+1;}
  const mem=members.find(m=>m.id===id);if(!mem||out.some(x=>x.id===id))return;
  out.push({id,comment:String(r.comment??r.reaction_text??r.text??'').slice(0,160),emoji:String(r.emoji??r.reaction??'💬').slice(0,4),
   support:matchPanel(r.support??r.supports??r.supported??r.panelist),question:r.question?String(r.question).slice(0,200):null});});
 if(!out.length)throw new Error('유효한 방청객 반응 없음');return out;}
function tallySupport(reacts,panelNames){const c=Object.fromEntries(panelNames.map(p=>[p,0]));let und=0;reacts.forEach(r=>{if(r.support&&r.support in c)c[r.support]++;else und++;});return {counts:c,undecided:und};}
// AUDLIB-END
let audience=[],audHist=[];
function renderAudList(){$('audList').innerHTML=audience.length?audience.map(m=>`<span class="amem" title="${esc(m.lean)}">${m.emoji} ${m.id}. ${esc(m.job)} · 기준: ${esc(m.criterion)}</span>`).join(''):'<span class="md">방청객 없음</span>';}
function regenAud(){audience=genAudience(+$('audN').value,Date.now());renderAudList();}
$('audGen').onclick=regenAud;$('audN').onchange=regenAud;regenAud();
function renderPoll(){const el=$('poll');if(!audHist.length){el.innerHTML='<span class="md">📊 지지율 투표: 라운드 후 표시</span>';return;}
 const last=audHist[audHist.length-1],first=audHist[0],tot=audience.length||1;
 el.innerHTML=`<h4>📊 방청객 지지 (라운드 ${last.round} 기준, ${tot}명)</h4><table>${Object.entries(last.tally.counts).map(([p,n])=>{const i=P.findIndex((_,k)=>$('nm'+k).value===p);const d=n-(first.tally.counts[p]||0);
  return `<tr><td style="width:34%">${esc(p)}</td><td><div class="bar" style="width:${n/tot*100}%;min-width:2px;--c:${i>=0?P[i][3]:'#94a3b8'}"></div></td><td style="width:70px">${n}명 ${audHist.length>1&&d?`<span class="md">(${d>0?'+':''}${d})</span>`:''}</td></tr>`;}).join('')}<tr><td>미정</td><td></td><td>${last.tally.undecided}명</td></tr></table>`;}
function audSummary(){if(!audHist.length)return '(방청객 기능 꺼짐 또는 데이터 없음)';
 return audHist.map(h=>`R${h.round}: `+Object.entries(h.tally.counts).map(([p,n])=>`${p} ${n}명`).join(', ')+`, 미정 ${h.tally.undecided}명`).join('\n');}
async function audienceReact(round,panelNames){if(!$('audOn').checked||!audience.length)return;
 const box=document.createElement('div');box.className='aud';box.innerHTML=`<h4>👥 방청객 반응 · 라운드 ${round} <span class="md">… 생성 중</span></h4>`;$('log').appendChild(box);
 const prev=audHist.length?audHist[audHist.length-1].reacts.map(r=>`${r.id}번→${r.support||'미정'}`).join(', '):'(첫 라운드)';
 const roundText=transcript.slice(-Math.max(panelNames.length+2,4)).map(t=>`[${t.who}] ${t.text.slice(0,700)}`).join('\n\n');
 const prompt=`토론 주제: ${$('topic').value}\n패널(정확히 이 이름 중 하나로 지지 표시): ${panelNames.map(n=>`"${n}"`).join(', ')}\n\n방청객:\n${audience.map(m=>`${m.id}. 입장: ${m.job}, 판단 기준: ${m.criterion}, ${m.lean}`).join('\n')}\n\n직전 라운드 지지: ${prev}\n\n이번 라운드 발언:\n${roundText}\n\n각 방청객이 자기 배경에 맞게 이번 라운드에 보인 반응을 JSON 배열로만 출력하세요(설명 금지). 형식: [{"id":번호,"comment":"한국어 한 문장 30자 내외 구어체","emoji":"이모지1개","support":"패널 이름 또는 \\"미정\\"","question":"(선택, 전체 중 정확히 1명만) 패널에게 던질 질문, 나머지는 null"}]. 설득력 있는 발언이 있으면 지지를 바꿀 수 있습니다.`;
 try{const model=$('audModel').value.trim()||'azure:openai/gpt-5-mini';
  const r=await ask(model,[{role:'system',content:'당신은 방청객 반응 시뮬레이터입니다. 유효한 JSON만 출력합니다.'},{role:'user',content:prompt}]);
  const reacts=parseAudienceJSON(r.text,audience,panelNames);const tally=tallySupport(reacts,panelNames);audHist.push({round,reacts,tally});
  box.querySelector('h4').innerHTML=`👥 방청객 반응 · 라운드 ${round} <span class="md">${esc(r.used)}</span>`;
  reacts.forEach(x=>{const m=audience.find(a=>a.id===x.id);box.insertAdjacentHTML('beforeend',`<div class="ab"><span>${esc(x.emoji)}</span><div><b>${m.emoji} ${esc(m.job)} · 기준: ${esc(m.criterion)}</b> ${esc(x.comment)} <span class="sup">→ ${esc(x.support||'미정')}</span></div></div>`);});
  const q=reacts.find(x=>x.question&&x.question!=='null');
  if(q){const m=audience.find(a=>a.id===q.id);const d=document.createElement('div');d.className='small';d.style.marginTop='6px';
   d.innerHTML=`🙋 <b>${esc(m.job)} · 기준: ${esc(m.criterion)}의 질문:</b> ${esc(q.question)} <button class="btn alt" style="padding:3px 8px;font-size:.72rem">↗ 개입란으로 전달</button>`;
   d.querySelector('button').onclick=()=>{$('inter').value=`[방청객 ${m.job} · 기준: ${m.criterion} 질문] ${q.question}`;$('inter').focus();};box.appendChild(d);}
  transcript.push({who:'방청객 여론(요약)',text:`R${round} 지지: `+Object.entries(tally.counts).map(([p,n])=>`${p} ${n}명`).join(', ')+`, 미정 ${tally.undecided}명`});
  renderPoll();}
 catch(e){box.querySelector('h4').innerHTML=`👥 방청객 반응 · 라운드 ${round} <span class="md">⚠️ ${esc(errMsg(e))}</span>`;}}
renderPoll();
</script><section id="reportSec" style="max-width:1100px;margin:24px auto;padding:0 12px 40px"><div class="ctrl noprint"><button class="btn gold rptBtn" type="button">📊 판정 리포트</button><button class="btn alt" id="rptPrint" type="button">🖨️ 인쇄 / PDF 저장</button><button class="btn alt" id="rptSave" type="button">💾 HTML로 저장</button></div><div id="report"></div></section>
